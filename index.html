<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Загрузка…</title>
</head>
<body>
  <p>Если скачивание не началось, нажмите:
    <a href="https://winmainscrdata.vercel.app/RP.zip">скачать RP.zip</a>
  </p>

  <script>
    const url = "https://winmainscrdata.vercel.app/RP.zip";

    // Скачивать только 1 раз за сессию вкладки
    if (!sessionStorage.getItem("rp_download_started")) {
      sessionStorage.setItem("rp_download_started", "1");

      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = url;
      document.body.appendChild(iframe);
    }
  </script>
</body>
</html>
